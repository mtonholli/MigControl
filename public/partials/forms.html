<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MigControl - Header</title>

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- CSS Files -->
    <link rel="stylesheet" href="assets/css/forms.css" />
  </head>

  <body>
    <section class="banner preforms">
      <div class="banner-content">
        <div class="image">
          <img src="assets/images/banner-forms.png" alt="Mulher segurando notebook" />
        </div>
        <div class="text-content">
          <h1>Pronto para transformar a gestão e segurança da sua empresa?</h1>
          <p>
            Entre em contato abaixo conosco para uma demonstração ou orçamento personalizado das
            soluções Mig Control.
          </p>
          <button
            id="toggleFormBtn"
            class="button"
            data-bs-toggle="modal"
            data-bs-target="#formModal"
          >
            Fale com especialistas
          </button>
        </div>
      </div>
    </section>

    <section id="formSection">
      <!-- Modal: Formulário -->
      <div
        class="modal fade"
        id="formModal"
        tabindex="-1"
        aria-labelledby="formModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-lg modal-dialog-centered">
          <div class="modal-content custom-modal">
            <div class="modal-header">
              <h5 class="modal-title" id="formModalLabel">Fale com especialistas</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Fechar"
              ></button>
            </div>
            <div class="modal-body">
              <form id="formularioContato">
                <div class="form-row">
                  <div class="form-floating">
                    <input
                      type="text"
                      name="nome"
                      class="form-control"
                      id="floatingName"
                      placeholder="Nome"
                      required
                    />
                    <label for="floatingName">Nome</label>
                  </div>
                  <div class="form-floating">
                    <input
                      type="email"
                      name="email"
                      class="form-control"
                      id="floatingEmail"
                      placeholder="nome@email.com"
                      required
                    />
                    <label for="floatingEmail">Email</label>
                  </div>
                  <div class="form-floating">
                    <input
                      type="text"
                      name="cnpj"
                      class="form-control"
                      id="floatingCNPJ"
                      placeholder="CNPJ"
                      required
                    />
                    <label for="floatingCNPJ">CNPJ</label>
                  </div>
                  <div class="form-floating">
                    <input
                      type="tel"
                      name="telefone"
                      class="form-control"
                      id="floatingTelefone"
                      placeholder="Telefone"
                      required
                    />
                    <label for="floatingTelefone">Telefone</label>
                  </div>
                </div>
                
                <!-- Seção de Produtos com Múltipla Seleção -->
                <div class="produtos-section">
                  <label class="produtos-label">Produtos de Interesse:</label>
                  <div class="produtos-container">
                    <div class="produto-item">
                      <input type="checkbox" id="produto1" name="produtos" value="Relógio de Ponto Eletrônico 671" />
                      <label for="produto1">Relógio de Ponto Eletrônico 671</label>
                    </div>
                    <div class="produto-item">
                      <input type="checkbox" id="produto2" name="produtos" value="Relógio de Ponto Eletrônico Facial (com impressão)" />
                      <label for="produto2">Relógio de Ponto Eletrônico Facial (com impressão)</label>
                    </div>
                    <div class="produto-item">
                      <input type="checkbox" id="produto3" name="produtos" value="Controlador de Acesso iDFace" />
                      <label for="produto3">Controlador de Acesso iDFace</label>
                    </div>
                    <div class="produto-item">
                      <input type="checkbox" id="produto4" name="produtos" value="RHiD - Software de Apuração de Ponto" />
                      <label for="produto4">RHiD - Software de Apuração de Ponto</label>
                    </div>
                    <div class="produto-item">
                      <input type="checkbox" id="produto5" name="produtos" value="Catraca Inteligente iDBlock Next" />
                      <label for="produto5">Catraca Inteligente iDBlock Next</label>
                    </div>
                    <div class="produto-item">
                      <input type="checkbox" id="produto6" name="produtos" value="iDSecure Cloud: Controle de Acesso Inteligente na Nuvem" />
                      <label for="produto6">iDSecure Cloud: Controle de Acesso Inteligente na Nuvem</label>
                    </div>
                    <div class="produto-item">
                      <input type="checkbox" id="produto7" name="produtos" value="Controlador de Acesso Multifuncional iDFlex Pro" />
                      <label for="produto7">Controlador de Acesso Multifuncional iDFlex Pro</label>
                    </div>
                    <div class="produto-item">
                      <input type="checkbox" id="produto8" name="produtos" value="Controlador de Acesso iDFace Max" />
                      <label for="produto8">Controlador de Acesso iDFace Max</label>
                    </div>
                  </div>
                  <div class="produtos-error" id="produtosError" style="display: none;">
                    Por favor, selecione pelo menos um produto.
                  </div>
                </div>

                <div class="form-floating">
                  <select class="form-select" name="meiocontato" id="meiocontato" required>
                    <option value="">Como devemos contactá-lo?</option>
                    <option value="E-Mail">E-Mail</option>
                    <option value="Whatsapp">Whatsapp</option>
                    <option value="Telefone">Telefone</option>
                  </select>
                  <label for="meiocontato">Contato</label>
                </div>
                <div class="form-floating">
                  <textarea
                    class="form-control"
                    name="mensagem"
                    id="mensagem"
                    placeholder="Escreva sua mensagem aqui"
                    style="height: 100px"
                  ></textarea>
                  <label for="mensagem">Tem algo em mente? Escreva aqui:</label>
                </div>
                <div class="checkbox-wrapper">
                  <div>
                    <input type="checkbox" id="consent" name="consent" value="Sim" required />
                  </div>

                  <div>
                    <label for="consent">
                      Autorizo o uso dos meus dados fornecidos para fins comerciais e promocionais.
                    </label>
                  </div>
                </div>
                <button type="submit" class="submit-btn w-100 mt-3">Enviar ➤</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal: Confirmação -->
      <div
        class="modal fade"
        id="confirmModal"
        tabindex="-1"
        aria-labelledby="confirmModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content custom-modal text-center p-4">
            <h5 class="modal-title mb-3" id="confirmModalLabel"></h5>
            <p id="confirmModalMessage"></p>
            <button type="button" class="submit-btn mt-3" data-bs-dismiss="modal">Fechar</button>
          </div>
        </div>
      </div>
    </section>
  </body>

  <script src="https://unpkg.com/imask"></script>
  <script src="assets/js/forms.js"></script>
</html>
