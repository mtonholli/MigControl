<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Login | MigControl</title>

		<!-- Bootstrap CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<!-- Font Awesome -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
		/>
		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
			rel="stylesheet"
		/>

		<!-- CSS Files -->
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="stylesheet" href="assets/css/login.css" />
	</head>
	<body>
		<div class="login-container">
			<div class="login-card">
				<h1 class="login-title">Bem-vindo</h1>
				<p class="login-subtitle">Acesse sua conta para continuar</p>

				<form id="loginForm" action="/login" method="POST">
					<div class="form-group">
						<label for="username">Usuário</label>
						<input
							type="text"
							id="username"
							name="username"
							required
							placeholder="Digite seu usuário"
						/>
					</div>

					<div class="form-group">
						<label for="password">Senha</label>
						<input
							type="password"
							id="password"
							name="password"
							required
							placeholder="Digite sua senha"
						/>
					</div>

					<button type="submit" class="login-btn">Entrar</button>
				</form>
			</div>
		</div>
	</body>
</html>
