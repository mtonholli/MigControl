<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Post | MigControl</title>

		<!-- Bootstrap CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>

		<!-- Font Awesome -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
		/>

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sansation:wght@400;700&display=swap"
			rel="stylesheet"
		/>

		<!-- CSS -->
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="stylesheet" href="assets/css/post.css" />
	</head>
	<body>
		<!-- Header -->
		<div id="header"></div>

		<!-- Banner do post -->
		<section class="post-banner">
			<img id="post-image" alt="Imagem do post" class="post-image" />
			<div class="banner-overlay">
				<h1 id="post-title"></h1>
				<span id="post-date"></span>
			</div>
		</section>

		<!-- Conteúdo do post -->
		<main class="container post-content">
			<div id="post-body" class="conteudo"></div>
		</main>

		<!-- Formulário e Footer -->
		<div id="forms"></div>
		<div id="footer"></div>

		<!-- Bootstrap JS -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

		<!-- Scripts personalizados -->
		<script type="module" src="assets/js/loadComponents.js"></script>
		<script src="assets/js/postLoader.js"></script>
	</body>
</html>
